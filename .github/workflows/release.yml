name: "Release"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version/tag to build (e.g. 1.3.6 or v1.3.6). Leave empty to use application/package.json version."
        required: false
        default: ""

jobs:
  publish-tauri:
    runs-on: windows-latest
    permissions:
      contents: write

    defaults:
      run:
        working-directory: aris-app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: application/package-lock.json

      - name: Determine release tag & auto-sync version
        id: version_step
        shell: pwsh
        run: |
          $inputVersion = "${{ inputs.version }}"
          $rawRef = "${{ github.ref_name }}"
          $targetVersion = ""

          if ($inputVersion -ne "") {
            $targetVersion = $inputVersion -replace '^v', ''
          } elseif ($rawRef -match '^v?(\d+\.\d+\.\d+.*)$') {
            $targetVersion = $Matches[1]
          } else {
            $pkg = Get-Content "package.json" -Raw | ConvertFrom-Json
            $targetVersion = $pkg.version
          }

          $tag = "v$targetVersion"
          Write-Host "Resolved target release tag: $tag (version: $targetVersion)"

          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "version=$targetVersion" >> $env:GITHUB_OUTPUT

          node scripts/sync-version.cjs "$targetVersion"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "application/src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Clean previous bundle output
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force src-tauri\target\release\bundle -ErrorAction SilentlyContinue

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_DATA_MODE: ${{ vars.VITE_DATA_MODE }}

          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

        run: npm run tauri build

      - name: Debug - list bundle contents
        shell: pwsh
        run: |
          Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse |
            Select-Object FullName

      - name: Upload Release Assets to GitHub
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: ${{ steps.version_step.outputs.tag }}
          name: "Release ${{ steps.version_step.outputs.tag }}"
          draft: false
          prerelease: false
          files: |
            application/src-tauri/target/release/bundle/**/*.exe
            application/src-tauri/target/release/bundle/**/*.sig
          fail_on_unmatched_files: false
