name: "Release"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version/tag to build (e.g. 1.3.6 or v1.3.6). Leave empty to use package.json version."
        required: false
        default: ""

jobs:
  publish-tauri:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm ci

      - name: Determine release tag & auto-sync version
        id: version_step
        shell: pwsh
        run: |
          $inputVersion = "${{ github.event.inputs.version }}"
          $rawRef = "${{ github.ref_name }}"
          $targetVersion = ""

          if ($inputVersion -ne "") {
            $targetVersion = $inputVersion -replace '^v', ''
          } elseif ($env:GITHUB_REF_TYPE -eq "tag") {
              $targetVersion = $rawRef -replace '^v', ''
          } else {
              $pkg = Get-Content "package.json" -Raw | ConvertFrom-Json
              $targetVersion = $pkg.version
          }

          $tag = "v$targetVersion"
          Write-Host "Resolved target release tag: $tag (version: $targetVersion)"

          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "version=$targetVersion" >> $env:GITHUB_OUTPUT

          node scripts/sync-version.cjs "$targetVersion"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Clean previous bundle output
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force src-tauri\target\release\bundle -ErrorAction SilentlyContinue

      - name: Build and publish Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_DATA_MODE: ${{ secrets.VITE_DATA_MODE }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        with:
          tagName: ${{ steps.version_step.outputs.tag }}
          releaseName: "Release ${{ steps.version_step.outputs.tag }}"
          releaseDraft: false
          prerelease: false

  notify:
    needs: [publish-tauri]
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord release message
        env:
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.publish-tauri.outputs.tag }}
          VERSION: ${{ needs.publish-tauri.outputs.version }}
          RELEASE_URL: "https://github.com/${{ github.repository }}/releases/tag/${{ needs.publish-tauri.outputs.tag }}"
        run: |
          NOTES=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body | cut -c1-1000)
          [ -z "$NOTES" ] && NOTES="No notes."

          case "$GITHUB_REPOSITORY" in
            *aris-app*) COLOR=16711680;;
            *aris-vista*) COLOR=65280;;
            *) COLOR=255;;
          esac

          JSON=$(jq -n \
            --arg title "New Release: $TAG" \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg user "$GITHUB_ACTOR" \
            --arg version "$VERSION" \
            --arg notes "$NOTES" \
            --arg url "$RELEASE_URL" \
            --arg time "$(date -u)" \
            --argjson color "$COLOR" \
            '{
              embeds: [{
                title: $title,
                color: $color,
                fields: [
                  { name: "Repository", value: $repo, inline: true },
                  { name: "User", value: $user, inline: true },
                  { name: "Version", value: $version, inline: true },
                  { name: "Release Notes", value: $notes, inline: false },
                  { name: "Release URL", value: $url, inline: false },
                  { name: "Time", value: $time, inline: false }
                ]
              }]
            }')

          curl -H "Content-Type: application/json" -d "$JSON" "$DISCORD_RELEASE_WEBHOOK"
