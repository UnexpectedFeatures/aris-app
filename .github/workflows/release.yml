name: "Release"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version/tag to build (e.g. 1.3.6 or v1.3.6). Leave empty to use application/package.json version."
        required: false
        default: ""

jobs:
  publish-tauri:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # Temporarily remove this
          # - platform: "macos-latest" # Apple Silicon
          #   args: "--target aarch64-apple-darwin"
          # - platform: "macos-latest" # Intel
          #   args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}

    defaults:
      run:
        working-directory: application

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: application/package-lock.json

      - name: Determine release tag & auto-sync version
        id: version_step
        shell: pwsh
        run: |
          $inputVersion = "${{ inputs.version }}"
          $rawRef = "${{ github.ref_name }}"
          $targetVersion = ""

          if ($inputVersion -ne "") {
            $targetVersion = $inputVersion -replace '^v', ''
          } elseif ($rawRef -match '^v?(\d+\.\d+\.\d+.*)$') {
            $targetVersion = $Matches[1]
          } else {
            $pkg = Get-Content "package.json" -Raw | ConvertFrom-Json
            $targetVersion = $pkg.version
          }

          $tag = "v$targetVersion"
          Write-Host "Resolved target release tag: $tag (version: $targetVersion)"
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "version=$targetVersion" >> $env:GITHUB_OUTPUT

          node scripts/sync-version.cjs "$targetVersion"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "application/src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci
      # - name: Clean previous bundle output (Linux)
      #   if: matrix.platform == 'ubuntu-22.04'
      #   run: rm -rf src-tauri/target/release/bundle

      - name: Clean previous bundle output (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: Remove-Item -Recurse -Force src-tauri\target\release\bundle -ErrorAction SilentlyContinue

      # Build the Tauri app (no GitHub Release)
      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SERVER_URL: ${{ secrets.VITE_SERVER_URL || 'http://localhost:50001' }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_HELP_RELEASE_URL: ${{ secrets.VITE_HELP_RELEASE_URL }}
        run: npm run tauri build -- ${{ matrix.args }}

      - name: Debug - list bundle contents
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse | Select-Object FullName

      - name: Upload Release Assets to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_step.outputs.tag }}
          name: "Release ${{ steps.version_step.outputs.tag }}"
          files: |
            application/src-tauri/target/release/bundle/**/*.exe
            application/src-tauri/target/release/bundle/**/*.sig
            application/src-tauri/target/release/bundle/**/*.AppImage
            application/src-tauri/target/release/bundle/**/*.deb
          fail_on_unmatched_files: false
